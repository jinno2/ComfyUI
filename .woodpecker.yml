when:
  - event: [pull_request, manual]
  - event: push
    branch: main
clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0
      fetch-target-branch: true
labels:
  platform: linux/amd64
steps:
  - name: lint
    image: python:3.12-slim
    commands:
      - python -m pip install ruff
      - ruff check .
  - name: unit-tests
    image: python:3.12-slim
    commands:
      - apt-get update && apt-get install -y --no-install-recommends git
      - pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - pip install -r requirements.txt
      - pip install -r tests-unit/requirements.txt
      - |
        status=0
        python -u -X faulthandler -m pytest tests-unit -q --maxfail=1 --tb=short > /tmp/pytest.log 2>&1 || status=$?
        echo "pytest exit status: $status"
        if [ "$status" -ne 0 ]; then
          tail -n 100 /tmp/pytest.log
        else
          grep -E "^pytest serial runtime: " /tmp/pytest.log || true
          tail -n 1 /tmp/pytest.log
        fi
        exit "$status"
