version: "0.3"

canonical_terms:
  ComfyUI:
    id: "TERM-COMFYUI"
    layer: "core"
    status: "stable"
    definition: "Modular node-graph based AI content generation engine; this repository is a local fork of it used for image-generation research."
    synonyms: ["comfy", "ComfyUI fork"]
    boundaries:
      includes: ["node-graph execution engine", "model loading and management", "local server and API"]
      excludes: ["upstream ComfyOrg hosted services", "third-party custom_nodes ecosystem"]
    related_terms: ["Node", "ForkUpstreamSync"]
    evidence:
      - source: "README.md#L1-L4"
        quote: "The most powerful and modular AI engine for content creation."
      - source: "docs/llm-wiki/index.md"
        quote: "上流 comfyanonymous/ComfyUI（モジュラー型 AI コンテンツ生成エンジン）のローカル fork/ワーキングコピー"

  ImprovementLoop:
    id: "TERM-LOOP"
    layer: "core"
    status: "stable"
    definition: "Bounded autonomous mission from LOOP.md: one run executes one improvement; candidates are prioritized test-failure -> TODO/FIXME -> docs mismatch; a run with no safe candidate ends with an interrupt report and no changes."
    synonyms: ["自律改善ループ", "loop run"]
    boundaries:
      includes: ["candidate selection", "minimal implementation", "verification via make test", "single commit", "interrupt report"]
      excludes: ["push/deploy/release (harness-owned landing)", "second improvement per run", "dependency major updates"]
    lifecycle: ["candidate_selected", "implemented", "verified", "committed", "reported"]
    related_terms: ["UnitTestGate", "MinimalChange"]
    evidence:
      - source: "LOOP.md#L6-L25"
        quote: "1 run = 1 改善。実行しない判断は「中断レポート」に書いて終わる。"

  UnitTestGate:
    id: "TERM-GATE"
    layer: "core"
    status: "stable"
    definition: "Commit gate defined by `make test` (Makefile: pytest tests-unit -v); a run must not commit while existing tests are broken."
    synonyms: ["テストゲート", "make test"]
    boundaries:
      includes: ["tests-unit pytest run", "commit blocking on red tests"]
      excludes: ["integration tests/ (real-server, optional per run)", "CI-only gates"]
    related_terms: ["ImprovementLoop"]
    assumptions:
      - id: "ASM-UNIT-001"
        text: "AUTO: gate scope is unit tests only (`make test`); integration tests are optional per run"
        decision_key: "AUTO:UnitTestGate.scope:unit_only"
        expires_after_runs: 20
    evidence:
      - source: "LOOP.md#L23"
        quote: "**検証** — `make test`。**既存テストを壊したまま commit しない**"
      - source: "Makefile#L451-L452"
        quote: "$(PYTHON) -m pytest tests-unit -v"

  MinimalChange:
    id: "TERM-MINCHANGE"
    layer: "domain"
    status: "stable"
    definition: "Every change touches the narrowest code path and the fewest files; no broad refactors, no new dependencies unless absolutely necessary; obsolete code is deleted aggressively."
    synonyms: ["最小変更", "最小差分"]
    boundaries:
      includes: ["narrowest code path", "fewest files", "dead code removal"]
      excludes: ["broad architecture rewrites", "new dependencies without necessity"]
    related_terms: ["ImprovementLoop"]
    evidence:
      - source: "AGENTS.md#Engineering Style"
        quote: "Change the least amount of files possible."
      - source: "LOOP.md#L22"
        quote: "触るファイルを必要最小限に。"

  ForkUpstreamSync:
    id: "TERM-FORK"
    layer: "domain"
    status: "stable"
    definition: "Fork relationship to upstream ComfyUI: fork-specific work lives after the single upstream merge (a402fd40, 2026-09-21) and is measured fresh as a402fd40^2..HEAD; the count grows with autonomous loop work (13 on 2026-09-20, ~20 on 2026-09-26, 35 on 2026-10-16, 55 on 2026-10-22T23:47Z at ae9f059d, 56 on 2026-10-22T23:52Z at 35d5cd46; per-run snapshots are retained in claims.ndjson, not duplicated here). The local up/master ref (f6c162dd, 2026-06-23) is stale and fully contained in HEAD; its ahead count includes merged upstream commits."
    synonyms: ["フォーク乖離", "upstream sync"]
    boundaries:
      includes: ["fork-specific commits", "a402fd40^2..HEAD measurement method", "upstream merge compatibility"]
      excludes: ["direct pushes to upstream", "PR/issue operations against upstream", "ahead-counts against the stale up/master ref"]
    related_terms: ["ComfyUI"]
    assumptions:
      - id: "ASM-FORK-001"
        text: "AUTO: fork-specific count is measured fresh per question as a402fd40^2..HEAD (56 at 35d5cd46 on 2026-10-22T23:52Z, in-worktree); wiki/CODEBASE_ANALYSIS figures are dated historical snapshots plus a pointer to this command"
        decision_key: "AUTO:ForkUpstreamSync.count:git_recency"
        expires_after_runs: 20
    evidence:
      - source: "git:a402fd40^2..HEAD (2026-10-22T23:52Z)"
        quote: "rev-list --count = 56 @ 35d5cd46; up/master..HEAD = 551; HEAD..up/master = 0 (upstream fully contained)"
      - source: "git:a402fd40^2..HEAD (2026-10-22T23:47Z)"
        quote: "rev-list --count = 55 @ ae9f059d; up/master..HEAD = 550; HEAD..up/master = 0 (upstream fully contained). Intermediate per-run snapshots of the same series (35/43/45/48/49/50/51/53/54 across 2026-10-16..22) are GC'd from this file; retrievable from git history and claims.ndjson"
      - source: "docs/llm-wiki/index.md"
        quote: "現行値は `git rev-list --count a402fd40^2..HEAD` で都度計測する（2026-09-26 観測 20、2026-10-22T05:10Z 観測 43、2026-10-22T20:18Z 観測 48）"
      - source: "docs/CODEBASE_ANALYSIS.md#L6"
        quote: "フォーク独自コミットは13件(2026-09-20 観測の履歴値。自律ループ作業で増え続けるため現行値は `git rev-list --count a402fd40^2..HEAD` で都度計測 — 2026-10-22 時点で 43)"

  Node:
    id: "TERM-NODE"
    layer: "domain"
    status: "stable"
    definition: "Extensibility unit registered through NODE_CLASS_MAPPINGS following INPUT_TYPES/RETURN_TYPES/FUNCTION/CATEGORY conventions; node-level code delegates model behavior changes to the model patcher class."
    synonyms: ["カスタムノード", "graph node"]
    boundaries:
      includes: ["node definition conventions", "NODE_CLASS_MAPPINGS registration"]
      excludes: ["direct model code patching from node level", "pass-through placeholder inputs"]
    related_terms: ["ComfyUI"]
    evidence:
      - source: "AGENTS.md#Nodes and User-Facing Behavior"
        quote: "Node-level code must not patch model code directly."
      - source: "docs/CODEBASE_ANALYSIS.md#L42"
        quote: "`nodes`(NODE_CLASS_MAPPINGS が全層から参照されるレジストリ)"

  Server:
    id: "TERM-SERVER"
    layer: "domain"
    status: "stable"
    definition: "HTTP/WebSocket API layer (server.py, aiohttp): exposes the client-facing API surface and bridges HTTP/WS requests into the execution pipeline."
    synonyms: ["PromptServer", "API server"]
    boundaries:
      includes: ["HTTP and WebSocket endpoints", "client-facing API surface"]
      excludes: ["prompt execution logic (ExecutionEngine)", "model VRAM/offload policy (ModelManagement)"]
    related_terms: ["ComfyUI", "ExecutionEngine"]
    evidence:
      - source: "docs/CODEBASE_ANALYSIS.md#L50"
        quote: "HTTP(`server.py`: aiohttp + /ws)"
      - source: "AGENTS.md#L49-L52"
        quote: "A PR that spreads one feature across unrelated loaders, nodes, execution, server, and frontend code needs a clear architectural reason, not just convenience."
      - source: "server.py#L215"
        quote: "class PromptServer():"
