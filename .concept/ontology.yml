  AttentionBackend:
    id: "TERM-ATTNBACKEND"
    layer: "domain"
    status: "stable"
    definition: "能力検出により選択される最適化 attention 実装の総体。comfy/ldm/modules/attention.py が capability チェックで optimized_attention を選定し（basic/sage/flash/xformers/pytorch）、comfy/ops.py が SDPA バックエンド優先順位（FLASH→CUDNN→EFFICIENT→MATH）を制御する。選択結果は不透明（INV-BACKEND-001）。"
    synonyms: ["optimized attention", "attention backend", "attention dispatch"]
    boundaries:
      includes: ["capability 選択 (xformers/flash/sage/pytorch/basic)", "SDPA バックエンド優先順位制御", "register/get_attention_function"]
      excludes: ["呼び出し側による選択関数の同一性・実装検査 (INV-BACKEND-001)", "モデル数学の本体", "量子化重みレイアウト (QuantOps)"]
    related_terms: ["QuantOps", "ModelManagement"]
    evidence:
      - source: "AGENTS.md#L178-L191"
        quote: "All models should use the optimized attention function selected by ComfyUI. Treat optimized backend functions, dispatch helpers, and capability-selected callables as opaque."
      - source: "comfy/ldm/modules/attention.py#L891-L904"
        quote: "optimized_attention = attention_basic ... optimized_attention = attention_pytorch"
      - source: "comfy/ops.py#L68-L96"
        quote: "SDPA_BACKEND_PRIORITY = [SDPBackend.FLASH_ATTENTION, SDPBackend.CUDNN_ATTENTION, SDPBackend.EFFICIENT_ATTENTION, SDPBackend.MATH]"
