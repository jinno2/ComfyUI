  LatentFormat:
    id: "TERM-LATENTFORMAT"
    layer: "domain"
    status: "stable"
    definition: "モデル族ごとの潜在レイアウト（チャネル数・スケール係数等）の所有者。LatentFormat 基底とモデル族サブクラスで構成され、レイアウト処理はモデル/latent-format 側に留める。"
    synonyms: ["latent layout", "latent format"]
    boundaries:
      includes: ["LatentFormat 基底とモデル族サブクラス", "latent_channels / scale_factor 等のレイアウト属性"]
      excludes: ["ノード側での latent 次元の collapse/expand", "VAE 実装本体"]
    related_terms: ["Sampler"]
    evidence:
