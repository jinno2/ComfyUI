version: "0.3"
canonical_terms:
  NodeGraph:
    id: "TERM-NODEGRAPH"
    layer: "aux"
    status: "stable"
    definition: "The declarative graph of nodes (DynamicPrompt) that ComfyUI expands and executes in topological order."
    synonyms: ["node graph", "visual node graph", "ノードグラフ"]
    boundaries:
      includes: ["declarative prompt graph", "topological execution order", "partial re-execution of changed subgraph"]
      excludes: ["user-facing saved workflow artifact (frontend JSON)", "VRAM/device load policy (ModelLoading)", "individual node implementations"]
    lifecycle: ["Built", "Expanded", "TopologicallySorted", "Executing", "Done"]
    related_terms: ["ModelLoading"]
    assumptions: []
    evidence:
      - source: "README.md#L38"
        quote: "Its powerful and modular node graph interface empowers creatives to generate images, videos, 3D models, audio, and more"
      - source: "README.md#L65"
        quote: "A visual node graph for building and reusing image, video, audio, 3D, and text workflows without code."
      - source: "comfy_execution/graph.py#L21-L212"
        quote: "class DynamicPrompt ... class TopologicalSort ... class ExecutionList(TopologicalSort)"
  ModelLoading:
    id: "TERM-MODELLOADING"
    layer: "aux"
    status: "stable"
    definition: "The policy layer that decides when and where models are loaded, partially loaded, or offloaded across VRAM/RAM."
    synonyms: ["model-loading behavior", "model offloading", "VRAM management"]
    boundaries:
      includes: ["VRAMState-driven load/offload decisions", "memory estimation", "asynchronous model loading"]
      excludes: ["model forward math and dtype init in model implementations", "quantized weight layouts (Quantization)", "native latent layout (LatentFormat)"]
    lifecycle: ["Unloaded", "PartiallyLoaded", "Loaded", "Offloaded"]
    related_terms: ["Quantization", "NodeGraph"]
    assumptions: []
    evidence:
      - source: "AGENTS.md#L20"
        quote: "Preserve existing APIs, node names, model-loading behavior, file layout, and workflow compatibility"
      - source: "README.md#L67"
        quote: "Efficient local execution with asynchronous queueing, partial graph re-execution, smart VRAM and RAM management, model offloading, and support for quantized models."
      - source: "comfy/model_management.py#L45-L939"
        quote: "class VRAMState ... def load_models_gpu(...)"
  LatentFormat:
    id: "TERM-LATENTFORMAT"
    layer: "aux"
    status: "stable"
    definition: "The per-model-family owner of native latent layout (channel count, scaling, packing) inside the model/latent-format layer."
    synonyms: ["latent layout", "latent-format owner", "native latent shape"]
    boundaries:
      includes: ["native latent shape and scaling factors", "per-family latent parameters (SD15, SDXL, SD3, Flux)"]
      excludes: ["caller-side latent collapse/expand/pack/unpack in nodes", "pixel-space images"]
    lifecycle: []
    related_terms: []
    assumptions: []
    evidence:
      - source: "AGENTS.md#L237-L240"
        quote: "Keep model-native latent layout handling inside the model or latent-format owner, not in helper nodes."
      - source: "comfy/latent_formats.py#L4-L197"
        quote: "class LatentFormat ... class SD15(LatentFormat) ... class Flux2(LatentFormat)"
  Quantization:
    id: "TERM-QUANTIZATION"
    layer: "aux"
    status: "stable"
    definition: "The 4/8-bit weight layout and metadata system (FP8, MXFP8, NVFP4) served by optimized shared kernels."
    synonyms: ["quantized models", "quantization metadata", "quant_ops"]
    boundaries:
      includes: ["FP8/MXFP8/NVFP4 weight layouts", "quantization metadata validation", "optimized shared kernel dispatch"]
      excludes: ["plain fp16/bf16 compute-dtype selection (ModelLoading policy)", "local reimplementations of existing optimized ops"]
    lifecycle: []
    related_terms: ["ModelLoading"]
    assumptions: []
    evidence:
      - source: "QUANTIZATION.md#L1"
        quote: "# The Comfy guide to Quantization"
      - source: "AGENTS.md#L147"
        quote: "Let unsupported model formats, invalid quantization metadata, and bad states fail with clear errors instead of silently producing lower quality output."
      - source: "comfy/quant_ops.py#L125-L183"
        quote: "class TensorCoreMXFP8Layout ... class TensorCoreNVFP4Layout ... class TensorCoreFP8E4M3Layout"
  ExecutionOrchestration:
    id: "TERM-EXECORCH"
    layer: "aux"
    status: "stable"
    definition: "The owner layer (execution.py + comfy_execution) that consumes the prompt graph and execution-relevant state, applies pluggable node-output caching, and produces execution results and errors."
    synonyms: ["execution orchestration", "PromptExecutor", "graph execution"]
    boundaries:
      includes: ["prompt-graph consumption and topological driving (via NodeGraph)", "pluggable node-output caching (Null/Basic/Hierarchical/LRU/RAMPressure)", "ExecutionResult outcomes (SUCCESS/FAILURE/PENDING)"]
      excludes: ["workflow ids, frontend ids, persistence ids, or API-only concepts (AGENTS.md boundary)", "VRAM load/offload policy (ModelLoading)", "persistence bookkeeping (AssetPersistence)"]
    lifecycle: ["Executing", "Success", "Failure", "Pending"]
    related_terms: ["NodeGraph", "ModelLoading", "AssetPersistence"]
    assumptions: []
    evidence:
      - source: "AGENTS.md#L44-L47"
        quote: "Treat `execution.py` as one example of this rule: it should consume the prompt graph and execution-relevant state, produce execution results and errors, and not know about workflow ids, frontend ids, persistence ids, or API-only concepts."
      - source: "execution.py#L56-L727"
        quote: "class ExecutionResult(Enum): ... class PromptExecutor: ... def execute(self, prompt, prompt_id, extra_data={}, execute_outputs=[]):"
      - source: "comfy_execution/caching.py#L151-L440"
        quote: "class BasicCache ... class HierarchicalCache(BasicCache) ... class NullCache ... class LRUCache(BasicCache)"
  AssetPersistence:
    id: "TERM-ASSETPERSIST"
    layer: "aux"
    status: "stable"
    definition: "The owner layer that persists asset state in a SQLAlchemy schema of six asset tables, with schema evolution owned by Alembic migrations."
    synonyms: ["asset database", "asset persistence", "asset store"]
    boundaries:
      includes: ["SQLAlchemy ORM models under app/assets/database/", "Alembic schema migrations in alembic_db/versions", "shared naming-convention Base in app/database/models.py"]
      excludes: ["execution-time bookkeeping inside execution.py", "workflow/prompt graph state"]
    lifecycle: []
    related_terms: ["ExecutionOrchestration"]
    assumptions: []
    evidence:
      - source: "app/assets/database/models.py#L1-L7"
        quote: "Declares the asset schema: content rows describing bytes on disk, records describing what a user sees, and the tag and metadata tables hanging off them."
      - source: "app/assets/database/models.py#L36-L37"
        quote: "class AssetContent(Base):\n    __tablename__ = \"asset_contents\""
      - source: "alembic_db/versions/0001_assets.py#L1-L2"
        quote: "Initial assets schema\nRevision ID: 0001_assets"
      - source: "alembic_db/versions/0008_missing_content_age.py#L1"
        quote: "\"\"\"Track when content becomes missing for age-based catalog cleanup.\"\"\""
  ApiLayer:
    id: "TERM-APILAYER"
    layer: "aux"
    status: "stable"
    definition: "The serving boundary (PromptServer, api_server routes, middleware, protocol) that exposes the execution engine to clients over HTTP/WebSocket and owns the prompt queue."
    synonyms: ["HTTP API", "server layer", "PromptServer"]
    boundaries:
      includes: ["HTTP/WS request handling and routing (PromptServer, InternalRoutes)", "CORS/origin and cache middleware", "binary preview event streaming (protocol.py BinaryEventTypes)", "prompt queue ownership bridging to execution"]
      excludes: ["graph execution itself (ExecutionOrchestration)", "VRAM load/offload policy (ModelLoading)", "asset persistence schema ownership (AssetPersistence)", "node implementations"]
    lifecycle: ["Listening", "Queued", "Streaming", "Closed"]
    related_terms: ["ExecutionOrchestration", "AssetPersistence", "NodeGraph"]
    assumptions: []
    evidence:
      - source: "AGENTS.md#L32-L38"
        quote: "Keep each layer focused on the concepts it owns. Do not leak UI, API, workflow, queue, persistence, telemetry, model-loading, node, or execution concerns into unrelated layers"
      - source: "server.py#L215-L227"
        quote: "class PromptServer(): ... self.asset_manager = asset_manager ... self.prompt_queue = execution.PromptQueue(self)"
      - source: "protocol.py#L2-L6"
        quote: "class BinaryEventTypes:\n    PREVIEW_IMAGE = 1\n    UNENCODED_PREVIEW_IMAGE = 2\n    TEXT = 3\n    PREVIEW_IMAGE_WITH_METADATA = 4"
      - source: "tests-unit/security_test/test_ghsa_779p_02_preview_traversal.py#L1-L6"
        quote: "\"\"\"CI unit tests for FIX #2 of GHSA-779p-m5rp-r4h4.\n\nPath traversal / hardening in app/model_manager.py get_model_preview"
