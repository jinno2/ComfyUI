  QuantOps:
    id: "TERM-QUANTOPS"
    layer: "domain"
    status: "stable"
    definition: "量子化重みレイアウトの共有実装。MXFP8/NVFP4/FP8 の TensorCore レイアウトを comfy-kitchen 由来の基底クラスで提供する。AGENTS.md により既存最適化 op の優先使用が義務化される。"
    synonyms: ["quantization", "NVFP4", "MXFP8"]
    boundaries:
      includes: ["TensorCore レイアウトクラス群", "量子化重みの共有 op と QUANT_ALGOS"]
      excludes: ["モデル固有の独自量子化数学", "float32 upcast による単なる再実装"]
    related_terms: ["ModelPatcher"]
    evidence:
      - source: "comfy/quant_ops.py#L125"
        quote: "class TensorCoreMXFP8Layout(_CKMxfp8Layout):"
      - source: "QUANTIZATION.md#L1"
        quote: "# The Comfy guide to Quantization"
      - source: "tests-unit/comfy_quant/test_mixed_precision.py#L20"
        quote: "from comfy.quant_ops import QUANT_ALGOS, QuantizedTensor"
