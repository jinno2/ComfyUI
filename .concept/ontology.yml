        quote: "Keep model-native latent layout handling inside the model or latent-format owner, not in helper nodes."
      - source: "tests-unit/comfy_test/test_seedvr2_model.py#L244"
        quote: "latent_format = comfy.latent_formats.SeedVR2()"
  PromptServer:
    id: "TERM-PROMPTSERVER"
    layer: "domain"
    status: "stable"
    definition: "HTTP/WebSocket API 表面の所有者。server.py が routes 登録と websocket_handler を管理し、実行内部 (execution.py) の概念を外に漏らさない。"
    synonyms: ["API server", "websocket server"]
    boundaries:
      includes: ["routes 登録", "websocket_handler", "クライアントへの通知"]
      excludes: ["実行オーケストレーション本体 (execution.py)", "コア外部通信の新設 (INV-NOINET-001)"]
    related_terms: ["ExecutionGraph"]
