version: "0.3"

canonical_terms:
  ExecutionGraph:
    id: "TERM-EXECGRAPH"
    layer: "core"
    status: "stable"
    definition: "プロンプトグラフとその実行の総体。comfy_execution/graph.py が DynamicPrompt/TopologicalSort/ExecutionList 等のグラフ構造を提供し、execution.py が検証 (validate_prompt)・キャッシュ (CacheEntry/CacheType/CacheSet)・実行結果生成を担う。workflow id や UI/API 固有概念は知らない。"
    synonyms: ["prompt graph", "execution graph", "DynamicPrompt"]
    boundaries:
      includes: ["グラフ検証 (validate_prompt)", "実行順序決定 (TopologicalSort/ExecutionList)", "実行キャッシュ (CacheSet)"]
      excludes: ["workflow id / frontend id / persistence id の保持", "UI・API 表面 (PromptServer)", "モデルロードとVRAMポリシー"]
    related_terms: ["PromptServer", "ModelPatcher"]
    evidence:
      - source: "comfy_execution/graph.py#L21"
        quote: "class DynamicPrompt:"
      - source: "comfy_execution/graph.py#L212"
        quote: "class ExecutionList(TopologicalSort):"
      - source: "execution.py#L1128"
        quote: "async def validate_prompt(prompt_id, prompt, partial_execution_list: Union[list[str], None]):"
      - source: "execution.py#L120"
        quote: "class CacheSet:"
      - source: "AGENTS.md#L45-L46"
        quote: "Treat `execution.py` as one example of this rule: it should consume the prompt graph and execution-relevant state"
      - source: "tests/execution/test_execution.py#L433"
        quote: "prompt = graph.finalize()"
  ModelPatcher:
    id: "TERM-MODELPATCHER"
    layer: "core"
    status: "stable"
    definition: "モデル重みパッチとデバイス/dtype 運用の唯一の正規経路。共有 nn.Module を clone-fork してパッチ状態を管理し、load_diffusion_model 系は読み込んだ BaseModel を ModelPatcher に包んで返す。ノードからモデル内部への直接改変は禁止。"
    synonyms: ["patcher", "model patching"]
    boundaries:
      includes: ["重みパッチ適用と clone-fork 状態管理", "cast_to_input による dtype キャスト", "ModelPatcherDynamic (DynamicVRAM 版)"]
      excludes: ["ノードからのモデル直接改変", "VRAM/オフロード方針の判断 (ModelManagement)", "モデル数学の実装"]
    related_terms: ["ModelManagement", "ExecutionGraph"]
    evidence:
      - source: "comfy/model_patcher.py#L340"
        quote: "class ModelPatcher:"
      - source: "comfy/model_patcher.py#L1752"
        quote: "class ModelPatcherDynamic(ModelPatcher):"
      - source: "comfy/sd.py#L2390"
        quote: "model_patcher = ModelPatcher(model, load_device=load_device, offload_device=offload_device, fast_disk=comfy.storage.state_dict_fast_disk(new_sd))"
      - source: "AGENTS.md#L361-L363"
        quote: "Node-level code must not patch model code directly. Any node behavior that modifies, wraps, hooks, or changes model behavior must go through the model patcher class instead of reaching into model internals."
      - source: "docs/CODEBASE_ANALYSIS.md#L65"
        quote: "model_patcher.py(共有 nn.Module を clone-fork するパッチ状態管理、LowVramPatch、DynamicVRAM 版 `ModelPatcherDynamic`)"
  ModelManagement:
    id: "TERM-MODELMGMT"
    layer: "core"
    status: "stable"
    definition: "デバイス/メモリの権威層。VRAMState/CPUState の状態管理と load_models_gpu / free_memory によるロード・オフロード方針を所有する。モデル実装内でメモリ管理を行わない規律の所有者。"
    synonyms: ["VRAM policy", "offload", "model management"]
    boundaries:
      includes: ["VRAMState / CPUState 状態管理", "load_models_gpu / free_memory", "低VRAM・オフロード判断"]
      excludes: ["モデル実装内のメモリ管理", "重みパッチ本体 (ModelPatcher)"]
    related_terms: ["ModelPatcher"]
    evidence:
      - source: "comfy/model_management.py#L45"
        quote: "class VRAMState(Enum):"
      - source: "comfy/model_management.py#L893"
        quote: "def free_memory(memory_required, device, keep_loaded=[], for_dynamic=False, pins_required=0, ram_required=0):"
      - source: "comfy/model_management.py#L939"
        quote: "def load_models_gpu(models, memory_required=0, force_patch_weights=False, minimum_memory_required=None, force_full_load=False):"
      - source: "docs/CODEBASE_ANALYSIS.md#L65"
        quote: "model_management.py(デバイス/メモリ権威、VRAMState、pin バジェット)"
      - source: "tests-unit/comfy_test/test_safe_linear.py#L6"
        quote: "import comfy.model_management"
  Sampler:
    id: "TERM-SAMPLER"
    layer: "domain"
    status: "stable"
    definition: "拡散サンプリングの実装層。comfy/samplers.py の Sampler/KSAMPLER が実体で cond バッチング等を担い、nodes.py の KSampler/KSamplerAdvanced はユーザー向けラッパノード。"
    synonyms: ["KSampler", "KSAMPLER", "sampling"]
    boundaries:
      includes: ["Sampler / KSAMPLER 実装", "cond バッチング (_calc_cond_batch)", "KSampler / KSamplerAdvanced ノードラッパ"]
      excludes: ["モデルアーキテクチャ", "潜在レイアウト (LatentFormat)"]
    related_terms: ["LatentFormat"]
    evidence:
      - source: "comfy/samplers.py#L919"
        quote: "class KSAMPLER(Sampler):"
      - source: "nodes.py#L1597"
        quote: "class KSampler:"
