version: "1.0"

planning:
  long_term_direction: "docs/plan/long-term-direction.md"
  current_wave: "docs/plan/milestones.md"
  executable_milestones: "docs/MILESTONES.md"
  status_vocabulary: "本書の milestone status は done / active / planned。docs/MILESTONES.md は同じ状態を achieved / in_progress 等（DoD 指定の語彙）で表記する。"
  note: "本書の product_goal が目的・非目標・成功条件の正本。docs/plan/long-term-direction.md は見直し記録と現在地（現状との差・到達段階）、docs/plan/milestones.md は約30分の実行波、docs/MILESTONES.md は MS-### 形式の実行用分解（正本への相対リンク）。"

product_goal:
  north_star: "上流 Comfy-Org/ComfyUI のローカル fork として、画像・動画・3D・音声生成に対応するモジュラー型ノードグラフ AI コンテンツ生成エンジンを、上流へ自動追従しない恒久自律開発で画像生成研究のために安定提供し続ける（推定）"
  success_metrics:
    - id: "MET-001"
      name: "unit test gate"
      target: "全 run で make test（pytest tests-unit）が 0 failed を維持する。既存テストを壊したまま commit しない。最新記録値は履歴として扱い、必要に応じて対象 SHA とともに新鮮な計測を記録する"
    - id: "MET-002"
      name: "CI gate and fork state visibility"
      target: "Woodpecker（Ruff + tests-unit）が PR と main への push で green。fork 固有コミット数は a402fd40^2..HEAD の新鮮な git 計測で把握し、docs 内の歴史値（13 / ~20）と混同しない"
  non_goals:
    - "上流 Comfy-Org/ComfyUI への自動追従（merge は所有者の明示指示時のみ: AUTOMATION.md Driver）"
    - "upstream への push / PR / issue 操作"
    - "deploy・リリース・対外送信"
    - "core への外部通信 path の追加（telemetry/analytics/update check 等一切禁止: AGENTS.md No Internet Requests）"
    - "third-party custom_nodes エコシステムの管理"
    - "後方互換レイヤの保持（fork は互換シム・レガシーエイリアスを積極削除: AGENTS.md）"

milestones:
  - id: "MS-001"
    name: "Fork infrastructure stability"
    intent: "無人稼働の阻害要因を排除し、fork 固有基盤（Makefile 標準化・クロスプラットフォーム対応・Woodpecker gate と upstream workflow ガード）を安定させる"
    supports: ["MET-001", "MET-002"]
    deliverables: ["Makefile 標準ターゲット（install/build/run/start/test/lint）", ".woodpecker.yml gate", "upstream テスト workflow のガード"]
    acceptance:
      - type: "test"
        target: "make test"
    priority: "P0"
    status: "done"
    depends_on: []
    exit_criteria:
      - "make test が 0 failed（最新記録: 2026-10-10 1930 passed / 0 failed / 74 skipped）"
      - "Woodpecker gate（Ruff + tests-unit 選別）が PR と main push で green"
    next_action: "維持のみ。新規の改善は LOOP.md の候補順に従い、この milestone には新たな成果を追加しない"
    evidence:
      - "Makefile に install/build/run/start/test/lint の標準ターゲットが存在（2026-11-03 観測）"
      - ".woodpecker.yml が pull_request / main push で Ruff + tests-unit を選別実行（2026-11-03 観測）"
      - "GitHub Actions 無効・Woodpecker 有効の運用記録: AUTOMATION.md Status"

  - id: "MS-002"
    name: "Asset persistence layer integrity"
    intent: "fork 固有のアセット永続化レイヤ（app/assets/database の SQLAlchemy スキーマと alembic_db/versions のマイグレーション）の整合を保ち、文書と実装の乖離を解消する"
    supports: ["MET-001"]
    deliverables: ["app/assets/database/models.py の 6 テーブル", "alembic_db/versions 0001..0008", "alembic_db/README.md の実態一致（CFLT-ASSETPERSIST-001 の解消）"]
    acceptance:
      - type: "test"
        target: "make test"
    priority: "P1"
    status: "active"
    depends_on: []
    exit_criteria:
      - "隔離した一時 DB に対し alembic upgrade head が exit 0 で完了し alembic current が単一 head と一致する"
      - "alembic_db/README.md の手順と versions 0001..0008 の実態が一致する（CFLT-ASSETPERSIST-001 の解消）"
      - "本 milestone の make test acceptance を同一候補の有効な証拠で満たす"
    next_action: "WP-A2（docs/plan/milestones.md）: alembic_db/README.md と versions 0001..0008 の実態一致を判定し、同一候補の make test 証拠と合わせて本 milestone の status と acceptance を証拠付きで確定する（約30分）。WP-A1 の実行記録は取得済み"
    evidence:
      - "app/assets/database/models.py に 6 テーブル（asset_contents / assets / asset_meta / asset_tags / tags / asset_system_state）: 2026-11-03 観測"
      - "alembic_db/versions に 0001..0008 の連鎖が存在: 2026-11-03 観測"
      - "WP-A1 の隔離実行証拠: docs/plan/evidence/wp-a1-alembic-chain.md（run 20261107-235007-331852、着地 commit 0075fd4f）: upgrade head が exit 0、heads/current とも単一 0008_missing_content_age に一致（2026-11-07 観測）"
      - "README 実態一致の判定と make test 同一候補証拠は未取得（WP-A2）"

  - id: "MS-003"
    name: "Concept synchronization"
intent: ".concept/ の辞書を実コード・テストと同期し、autopilot 品質基準（Q1-Q8）を満たしながら、追跡対象を永続シード3ファイルに保ち、生成 runtime metadata を追跡対象へ戻さない"
    supports: ["MET-001"]
    deliverables:
      - "追跡する永続シード: charter.yml, autopilot.yml, ontology_budget.yml"
      - "生成される runtime メタデータ12ファイルを Git 追跡から除外し、tests-unit/concept_metadata_tracking_test.py でガードする"
      - "ontology / invariants / mappings 相当の辞書追加は、対応する概念を観測した時点で個別に判断する（常設ファイルを作らない）"
    acceptance:
      - type: "test"
        target: "pytest tests-unit/concept_metadata_tracking_test.py -q; git ls-files .concept lists only charter.yml, autopilot.yml, ontology_budget.yml"
    priority: "P2"
    status: "active"
    depends_on: []
    exit_criteria:
      - ".concept/*.yml の yaml parse が成功する"
      - "git ls-files .concept が charter.yml / autopilot.yml / ontology_budget.yml の 3 ファイルと一致し、非追跡 runtime 12 ファイルが check-ignore される"
    next_action: "WP-C2（docs/plan/milestones.md）: make test を 1 回実行して MET-001 の実測と対象 SHA を記録し、charter の MET-001 記載を実測値へ更新する（約30分）。deviations があれば本 milestone の deliverables へ反映する"
    evidence:
      - "820d2ae4 (#43) で runtime 生成物 12 ファイルの Git 追跡を解除し、追跡は 3 ファイルになった（git ls-files .concept 実測）"
      - "ガードテスト tests-unit/concept_metadata_tracking_test.py が追跡/除外の回帰を検査する"
      - "旧記載だった deliverables『固定 14 ファイル構成』は 2026-11-03 に現構成へ修正した（未了の乖離は解消）"

  - id: "MS-004"
    name: "フォーク状態の可視化"
    intent: "fork 固有コミットと upstream 同期状態を新鮮な git 計測で把握し続ける"
    supports: ["MET-002"]
    deliverables: ["ForkUpstreamSync 計測記録（claims/evidence）"]
    acceptance:
      - type: "manual_review"
        target: ".concept/claims.ndjson の ForkUpstreamSync 計測 claim"
    priority: "P1"
    status: "active"
    depends_on: []

  - id: "MS-005"
    name: "ドキュメントと実装の不一致解消"
    intent: "README/docs の手順と実装のズレを LOOP.md 候補源として継続解消する"
    supports: ["MET-001"]
    deliverables: ["不一致の修正コミット"]
    acceptance:
      - type: "manual_review"
        target: "docs/ と実装の差分確認"
    priority: "P2"
    status: "planned"
    depends_on: []

work_policy:
  default_mode: "commit"
  iteration_budget:
    max_cycles: 5
    max_files_changed: 25
  quality_gates:
    must_pass: ["lint", "make test"]
