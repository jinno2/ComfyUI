  - id: "AMB-UNIT-002"
    term: "UnitTestGate"
    topic: "CI gate (Woodpecker --maxfail=1 -q) vs local make test (-v, no maxfail) behavioral difference"
    status: "open"
    severity: "low"
    uncertainty: 0.3
    candidates:
      - "The two invocations are equivalent for gate purposes; --maxfail=1 only shortens CI output"
      - "maxfail and verbosity affect wall-time/coverage enough that local green does not imply CI green"
    missing_info:
      - "Measured wall-time comparison between the two invocations"
    linked_conflicts: []
    last_touched_run: "2026-10-23T00:39:24Z"
    evidence:
      - source: ".woodpecker.yml#L29"
        quote: "python -u -X faulthandler -m pytest tests-unit -q --maxfail=1 --tb=short"
      - source: "Makefile#L452"
        quote: "$(PYTHON) -m pytest tests-unit -v"
      - source: "make test VENV_BIN=/home/jinno/ComfyUI/.venv/bin (2026-10-23T00:47Z, in-worktree @ 40a7bdef)"
        quote: "wall 7m12s, exit 0, all shown tests PASSED — the local suite completes well within the 15-30 min run budget. The worktree itself has no .venv; the main checkout's venv is borrowed via VENV_BIN."
      - source: "docs/dot/milestones.md#完了と再計画"
        quote: "D1-3 は CI（`.woodpecker.yml` の `--maxfail=1`）とローカル（`make test` の無指定 maxfail）の比較を**成果に含めない**。 両者の差が gate の所要時間に効くかは、次の実行波で独立WPとして割り当てる。"

