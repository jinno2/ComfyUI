    topic: "Q3 threshold and test-anchor aggregation semantics"
    status: "open"
    severity: "medium"
    uncertainty: 0.4
    candidates:
      - "Count unique extractable test files with at least one invariant check (current 1/185; 93 files reach 50%)"
      - "Count test-anchored invariant checks per file; aggregation semantics need definition"
    missing_info:
      - "Whether one invariant may cover multiple test files and whether Q3 counts unique files or invariant checks"
    linked_conflicts: []
    auto_decision:
      status: "applied"
      decision_key: "AUTO:Q3.coverage:report_observed"
      chosen: "Report the current unique-file observation as 1/185 (0.5%) and FAIL against the existing 50% threshold. Do not invent invariant coverage or relax the threshold; the 60-invariant cap alone does not prove the target impossible because one invariant may contain multiple test checks."
      policy: "primary_evidence + budget_integrity"
      confidence_auto: 0.85
      decided_at_run: "2026-10-23T02:27:05Z"
      expires_after_runs: 20
