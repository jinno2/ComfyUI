invariants:
  - id: "INV-CORE-001"
    related_terms: []
    status: "stable"
    strength: "hard"
    statement: "Core ComfyUI must not make outbound requests to the internet: no uploads, telemetry, analytics, tracking, crash reporting, update checks, remote config, feature flags, or opt-in/opt-out/anonymized request paths in core."
    rationale: "Local-only execution is a core product contract; any outbound path is refused regardless of labeling."
    assumptions: []
    evidence:
      - source: "AGENTS.md#L59-L70"
        quote: "Do not add code to core ComfyUI that makes requests to the internet. ... These labels do not make internet access acceptable."
    checks:
      - type: "review"
        target: "any PR touching network-capable code paths in core"
  - id: "INV-CI-001"
    related_terms: []
    status: "stable"
    strength: "soft"
    statement: "Unit-test CI runs must emit machine-checkable evidence of the actual serial/xdist worker allocation: tests-unit conftest prints 'pytest serial runtime: process=<pid> collected=<N>' at session finish when xdist is absent, and the Woodpecker unit-tests step greps that line into the CI log on success."
    rationale: "CI logs must carry the real worker allocation instead of an assumed one; removing the conftest line or the grep silently degrades CI observability."
    assumptions: []
    evidence:
      - source: "tests-unit/conftest.py#L24-L30"
        quote: "CI evidence consumers need the actual allocation: under xdist the native \"N workers [M items]\" collection lines are that evidence, so stay silent."
      - source: ".woodpecker.yml#L34"
        quote: "grep -E \"^pytest serial runtime: \" /tmp/pytest.log || true"
      - source: "commit:20b3e40c"
        quote: "ci: emit actual serial worker allocation evidence (#17)"
    checks:
      - type: "review"
        target: "any PR removing or renaming the conftest serial-runtime line or the Woodpecker grep"
  - id: "INV-CI-002"
    related_terms: []
    status: "stable"
    strength: "hard"
    statement: "Auto-triggered upstream GitHub Actions workflows must not execute on this fork: every workflow with push/pull_request/schedule triggers carries a job-level `if: github.repository == 'Comfy-Org/ComfyUI'` gate, and CI runs through Woodpecker (.woodpecker.yml) instead."
    rationale: "This fork's CI policy is Woodpecker-only; unguarded upstream workflows burn GitHub-hosted runners on every push/PR and some auto-commit (update-version) or require upstream-only secrets (detect-unreviewed-merge)."
    assumptions: []
    evidence:
      - source: ".woodpecker.yml#L19"
        quote: "- ruff check ."
      - source: ".woodpecker.yml#L29-L34"
        quote: "python -u -X faulthandler -m pytest tests-unit -q --maxfail=1 --tb=short > /tmp/pytest.log 2>&1 || status=$?"
      - source: "commit:4e0219aa"
        quote: "Guard upstream test workflows and add Woodpecker gate"
      - source: "commit:35d42c4f"
        quote: "Fix fork CI: gate upstream-only checks, drop unused import (#5)"
    checks:
      - type: "review"
        target: "any new upstream workflow file with push/pull_request/schedule triggers added without the repository gate"
  - id: "INV-FORK-001"
    related_terms: ["ModelLoading"]
    status: "stable"
    strength: "soft"
    statement: "This fork does not retain backward-compatibility shims: deprecated wrappers, legacy aliases, and compatibility-only entry points are removed aggressively; breakage of external consumers is accepted per fork policy."
    rationale: "Fork does permanent autonomous development without upstream tracking; compat baggage becomes gravity against evolution."
    assumptions: []
    evidence:
      - source: "AGENTS.md#L22-L24"
        quote: "When compatibility is explicitly out of scope, remove compatibility-only aliases, duplicate nodes, legacy entry points, and preset wrappers instead of retaining parallel ways to perform the same operation."
      - source: "commit:a00eb338"
        quote: "refactor: remove deprecated calc_cond_uncond_batch wrapper"
      - source: "commit:a00eb338"
        quote: "refactor: remove legacy execute aliases in nodes_mask.py"
      - source: "commit:8986b64f"
        quote: "Remove comfy.clip_vision.clip_preprocess alias"
    checks:
      - type: "review"
        target: "any PR re-adding a compatibility alias, wrapper, or deprecation warning path"
