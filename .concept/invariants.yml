invariants:
  - id: "INV-NODE-001"
    related_terms: ["Node"]
    status: "draft"
    strength: "hard"
    statement: "Node は NODE_CLASS_MAPPINGS に登録されなければ起動時に収集されず、グラフで使用できない"
    rationale: "未登録ノードの静かな欠落を防ぐ"
    assumptions:
      - id: "ASM-INV-NODE-001"
        text: "AUTO: 動的収集は hasattr(NODE_CLASS_MAPPINGS) のみを正とする"
        decision_key: "AUTO:Node.registration:hasattr_gate"
        expires_after_runs: 20
    evidence:
      - source: "nodes.py#L2243-L2244"
        quote: "if hasattr(module, \"NODE_CLASS_MAPPINGS\") ... for name, node_cls in module.NODE_CLASS_MAPPINGS.items():"
